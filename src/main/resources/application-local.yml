spring:
  datasource:
    url: jdbc:mysql://localhost:3306/stock
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Redis配置
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

# MyBatis配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: org.example.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

server:
  port: 8080

# 数据导入配置
app:
  data-import:
    path: /Users/lynn/IdeaProject/study/stock_addition_data
    enabled: true
logging:
  level:
    org.example.service.impl.StockSelectionServiceImpl: DEBUG